# ============================================================
# Secret Template - 僅作為 Key 結構參考，禁止填入實際值
# ============================================================
# 實際值注入方式（擇一）：
#   1. AWS Secrets Manager + External Secrets Operator（推薦）
#      ExternalSecret CR 會自動從 Secrets Manager 同步並建立此 Secret
#   2. AWS KMS + Sealed Secrets（地端部署）
#      使用 kubeseal 加密後可安全存入 git
#   3. HashiCorp Vault Agent Injector
#      透過 annotation 注入 sidecar 動態取得 secret
#
# 禁止事項：
#   - 禁止將此檔案含實際值 commit 進 git
#   - 禁止以 base64 明文方式存入 git（base64 不是加密）
# ============================================================
apiVersion: v1
kind: Secret
metadata:
  name: stock-platform-secret
  labels:
    app: stock-platform
    component: backend
  annotations:
    # 標記此 Secret 由 External Secrets Operator 管理
    # 實際值請參考 AWS Secrets Manager 路徑：/stock-platform/{env}/
    managed-by: "external-secrets-operator"
type: Opaque
stringData:
  # ── 資料庫連線（由 AWS Secrets Manager 注入）─────────────────────────────
  # Secrets Manager key: /stock-platform/prod/db-url
  STOCK_DB_URL: "<INJECT_FROM_SECRETS_MANAGER>"

  # Secrets Manager key: /stock-platform/prod/db-username
  STOCK_DB_USERNAME: "<INJECT_FROM_SECRETS_MANAGER>"

  # Secrets Manager key: /stock-platform/prod/db-password
  STOCK_DB_PASSWORD: "<INJECT_FROM_SECRETS_MANAGER>"

  # ── Redis（由 AWS Secrets Manager 注入）──────────────────────────────────
  # Secrets Manager key: /stock-platform/prod/redis-host
  STOCK_REDIS_HOST: "<INJECT_FROM_SECRETS_MANAGER>"

  # Secrets Manager key: /stock-platform/prod/redis-password
  STOCK_REDIS_PASSWORD: "<INJECT_FROM_SECRETS_MANAGER>"

  # ── JWT（由 AWS KMS 產生後存入 Secrets Manager）─────────────────────────
  # 長度需 ≥ 256 bit（32 bytes），建議使用 KMS 產生的 256-bit 亂數
  # Secrets Manager key: /stock-platform/prod/jwt-secret
  STOCK_JWT_SECRET: "<INJECT_FROM_SECRETS_MANAGER>"
